version: '3.8'

services:
  nesca:
    build: .
    container_name: nesca
    volumes:
      - ./config.conf:/app/config.conf:ro
      - ./targets.txt:/app/targets.txt:ro
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - scanning

networks:
  scanning:
    driver: bridge